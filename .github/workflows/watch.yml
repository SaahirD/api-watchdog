name: Watch Stripe API Changes

on:
  schedule:
    # Every 12 hours, at 00:00 and 12:00 UTC.
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      create_prs:
        description: 'Open real PRs for any fixes found (unchecked = dry run, print-only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watch-stripe
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install oasdiff
        # Go binary, not a pip package — used by stripe_spec_monitor.py
        # (Phase 5) to diff Stripe's OpenAPI spec. Pinned to an exact
        # version rather than tracking main, so an oasdiff-side output
        # schema change doesn't silently break _normalize_oasdiff_entry.
        # Reconfirm this is still current at github.com/oasdiff/oasdiff/releases
        # before bumping.
        run: |
          curl -sSfL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh -s -- -b /usr/local/bin v1.29.1
          oasdiff --version

      - name: Restore Stripe changes cache
        uses: actions/cache@v4
        with:
          path: |
            .stripe_changes_cache.json
            .stripe_spec_cache.json
          # v2: bumped after the v1 prefix got poisoned by a dry-run
          # verification pass (see CLAUDE.md — get_pending_changes() writes
          # the seen-changes cache unconditionally, even without
          # --create-prs, so a dry run before a real run can hide a change
          # the real run should have acted on). Bump the version suffix
          # again if this ever needs a deliberate fresh start.
          key: stripe-changes-cache-v2-${{ github.run_id }}
          restore-keys: |
            stripe-changes-cache-v2-

      - name: Run api-watchdog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Secret names cannot start with GITHUB_ — that prefix is reserved
          # by GitHub Actions (creating GITHUB_APP_ID/GITHUB_PRIVATE_KEY as
          # secrets is refused outright). The Python code still reads the
          # GITHUB_APP_ID / GITHUB_PRIVATE_KEY env vars — only the secret
          # *names* differ.
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Used by stripe_spec_monitor.py to authenticate its (light,
          # ~1 req/run) calls to api.github.com/repos/stripe/openapi —
          # raises the rate limit from 60/hr (unauthenticated, shared
          # across the whole runner IP pool) to 1000/hr. NOT present in a
          # step's environment automatically — GitHub Actions requires it
          # be explicitly wired from the auto-created secrets.GITHUB_TOKEN,
          # which is what this line does; it needs no repo Settings setup.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.create_prs }}" = "true" ]; then
            python src/main.py --github-repo ${{ github.repository }} --create-prs
          else
            python src/main.py --github-repo ${{ github.repository }}
          fi
